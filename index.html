<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Database Workshop</title>
    
</head>
<body>
    <h1> Status en direct </h1>

    <input type="text" id="statusInput" placeholder="Entrez votre statut"> 
    <button id="btnSave">Enregistrer le status </button>
    
    <h2> Statut actuel : <span id="statusDisplay">... </span></h2>

    <script type="module">
        // Import the functions you need from the SDKs you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app); 
const statusRef = ref(db, 'status');

// Ecriture des données dans la base de données 
document.getElementById("btnSave").addEventListener("click", ()=> {
    const text = document.getElementById("statusInput").value;
    set(statusRef, text);
}); 

// Lecture des données en temps réel
onValue(statusRef, (snapshot) => {
    const data = snapshot.val();
    document.getElementById("statusDisplay").innerText = data || "Aucun status"; 

});
    </script>

    
</body>
</html>
